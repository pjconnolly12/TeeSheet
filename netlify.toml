[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"

[[scheduled.functions]]
  name = "send-round-reminders"
  cron = "0 * * * *"

[[scheduled.functions]]
  name = "delete-past-rounds"
  cron = "0 * * * *"
